; ------------------------------------------------------------------
;  PulseOx -- MAX30102 pulse oximeter, ATmega32A @ 16 MHz
;
;  Four environments, all the same code and the same board.  They exist
;  because 32 KB of flash minus a bootloader cannot hold the everyday
;  firmware AND a full verbose diagnostic stream AND a one-shot factory
;  probe at the same time with any working margin -- measured, not
;  guessed: see "Flash budget" in the README.
;
;    atmega32   DEFAULT.  Everyday build.  Diagnostic UART on; the
;               one-shot channel probe is NOT compiled in, because its
;               verdict is cached in EEPROM and only has to be
;               established once per sensor.  Boots in about a second.
;
;    probe      Flash this ONCE on a new board, or after a factory reset,
;               to establish which FIFO word belongs to which emitter.
;               It stores the answer in EEPROM and every other build then
;               honours it.  Then go back to `atmega32`.
;
;    release    Production.  Diagnostics compiled out entirely, worth
;               about 3.8 KB of flash -- this is the build to ship.
;
;    csv        Evidence gathering.  One CSV record per detected beat on
;               the UART, for tuning against captured data rather than
;               against guesses.  See README, "Capturing data".
;
;  Build a specific one with:  pio run -e release
;  Upload one with:           pio run -e release -t upload
;
;  `framework` is deliberately empty: this is bare-metal AVR C compiled
;  straight against avr-libc.  There is no Arduino core and no MightyCore
;  core linked in -- MightyCore is used only for its avrdude 8.0 (see the
;  upload section below) and for the pinout convention the wiring follows.
; ------------------------------------------------------------------

[common]
platform     = atmelavr
board        = ATmega32
framework    =
board_build.f_cpu = 16000000UL
board_build.mcu   = atmega32
build_flags  = -Os -std=gnu99 -Wall -Wextra
               -Wundef -Wshadow -Wpointer-arith -Wcast-align
               -Wstrict-prototypes -Wmissing-prototypes -Wredundant-decls
               -Werror=implicit-function-declaration
               -funsigned-char -funsigned-bitfields -fpack-struct -fshort-enums
               -ffunction-sections -fdata-sections
build_unflags = -std=gnu11
build_src_filter = +<*.c>

; Fails the build if code+data would reach the bootloader, or if static
; SRAM leaves too little for the stack.  avr-size measures against the
; bare 32 KB / 2 KB and so never warns about either.
extra_scripts = post:scripts/check_size.py

; Bytes at the top of flash that belong to urboot and must stay clear.
; 512 is the usual footprint for this part; measure yours before trusting
; it -- see README, "Flash budget".
board_upload.bootloader_reserve = 512
; SRAM held back for the call stack.  Measured worst case is 182 B; the
; firmware also reports its own high-water mark, see README "Stack".
board_upload.stack_reserve      = 224

; ---------------- urboot bootloader upload (UART0) ----------------
; PlatformIO bundles avrdude 6.3, which has no "urclock" programmer at all
; ("Can't find programmer id"), so the upload button cannot use it.  Point it
; at MightyCore's avrdude 8.0 instead -- the same binary and the same flags
; that work from the command line.
;
;   -curclock      the urboot/urclock programmer
;   -D             no chip erase; a bootloader cannot erase itself
;   -xnometadata   urboot stores no avrdude metadata page
;   flash only     so settings already saved in EEPROM survive an upload
;
; Override the port with:  pio run -t upload --upload-port COM7
upload_protocol = custom
upload_port     = COM3
upload_flags    =
    -C${sysenv.LOCALAPPDATA}/Arduino15/packages/MightyCore/tools/avrdude/8.0-arduino.1/etc/avrdude.conf
    -patmega32
    -curclock
    -P$UPLOAD_PORT
    -b115200
    -D
    -xnometadata
upload_command  = "${sysenv.LOCALAPPDATA}/Arduino15/packages/MightyCore/tools/avrdude/8.0-arduino.1/bin/avrdude.exe" $UPLOAD_FLAGS -Uflash:w:$SOURCE:i

; The diagnostic stream in dbg.c is TX-only at 38400 (see config.h)
monitor_port  = COM3
monitor_speed = 38400

; fuses: external crystal >= 8 MHz, CKOPT programmed, JTAG disabled
board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xC9

; ------------------------------------------------------------------
;  Default: everyday build.  Full "name=value" diagnostic UART, no
;  one-shot channel probe -- the probe's verdict is read from EEPROM,
;  where env:probe put it.  See the note at the top of this file.
; ------------------------------------------------------------------
[env:atmega32]
extends     = common
build_flags = ${common.build_flags} -DDBG_LED_PROBE=0

; ------------------------------------------------------------------
;  One-shot: establish the FIFO channel order against the hardware and
;  store it in EEPROM.  Flash once per board, then go back to the
;  default.  Adds about 5 s to start-up on the boot that runs it.
; ------------------------------------------------------------------
; DBG_STATUS=0 drops the everyday 2-second status line: this build has
; the probe compiled in and cannot afford both, and it does not need it
; -- the probe prints its own three data lines and its verdict.
[env:probe]
extends     = common
build_flags = ${common.build_flags} -DDBG_LED_PROBE=1 -DDBG_STATUS=0

; ------------------------------------------------------------------
;  Production: no UART diagnostics, no channel probe.  Ship this.
; ------------------------------------------------------------------
[env:release]
extends     = common
build_flags = ${common.build_flags} -DDBG_MODE=0 -DDBG_LED_PROBE=0

; ------------------------------------------------------------------
;  Evidence gathering: one CSV record per beat, plus a header line.
;  38400 baud is enough for this; see README, "Capturing data".
; ------------------------------------------------------------------
[env:csv]
extends     = common
build_flags = ${common.build_flags} -DDBG_MODE=2 -DDBG_LED_PROBE=0

